<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Turno</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>
<body>
    <h1>Detalle de Turno</h1>
    <hr/>

    <!-- Detalle del turno -->
    <section th:if="${turno != null}">
        <p><strong>ID:</strong> <span th:text="${turno.idTurno}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${turno.fecha}"></span></p>
        <p><strong>Hora:</strong> <span th:text="${turno.hora}"></span></p>
        <p><strong>Duración:</strong> <span th:text="${turno.duracionMinutos} + ' minutos'"></span></p>
        <p><strong>Cliente CUIT:</strong> <span th:text="${turno.cuitCliente}"></span></p>
        <p><strong>Empleado:</strong> <span th:text="${turno.dniEmpleado}"></span></p>
        <p><strong>Lugar:</strong> <span th:text="${turno.direccionLugar}"></span></p>
        <p><strong>Presencial:</strong> <span th:text="${turno.presencial} ? 'Sí' : 'No'"></span></p>
        <p><strong>Servicio:</strong> <span th:text="${turno.descripcionServicio}"></span></p>
    </section>

    <!-- Mensaje informativo -->
    <section th:if="${mensaje != null}">
        <p class="mensaje" style="max-width:600px; margin: 0 auto; text-align:center; color:#666; font-style: italic;" th:text="${mensaje}"></p>
    </section>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>
    </div>
</body>
</html>
