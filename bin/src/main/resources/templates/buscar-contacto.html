<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestión de Contactos</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>
<body>
    <h1>Gestión de Contactos</h1>
    <hr/>

    <!-- Buscar Contacto -->
    <section>
        <h2>Buscar Contacto</h2>
        <form th:action="@{/contactos/buscar-por-email}" method="get">
            <label for="emailBuscar">Email:</label>
            <input type="text" id="emailBuscar" name="email" required>
            <button type="submit">Buscar</button>
        </form>
    </section>

    <!-- Ver Todos los Contactos -->
    <section>
        <h2>Ver Todos los Contactos</h2>
        <form th:action="@{/contactos/todos}" method="get">
            <button type="submit">Ver Todos</button>
        </form>
    </section>

    <!-- Botón Volver -->
    <div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>
    </div>

</body>
</html>
