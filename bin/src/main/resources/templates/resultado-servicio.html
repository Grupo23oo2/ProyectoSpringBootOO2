<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado del Servicio</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>
<body>

<h1>Resultado de Búsqueda</h1>

<hr/>

<!-- Mensaje de éxito -->
<p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>

<!-- Detalles del servicio -->
<section th:if="${servicio != null}">
    <h2>Servicio Encontrado</h2>
    <p><strong>Descripción:</strong> <span th:text="${servicio.descripcion}"></span></p>
    <p><strong>Duración:</strong> <span th:text="${servicio.duracion}"></span> minutos</p>
    <p><strong>Activo:</strong> <span th:text="${servicio.activo} ? 'Sí' : 'No'"></span></p>
</section>

<!-- Botón volver -->
<div style="text-align: center; margin-top: 20px;">
    <a href="/" class="btn">← Volver</a>
</div>

</body>
</html>
