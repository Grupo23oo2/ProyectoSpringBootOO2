<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Lugares</title>
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>
<body>

<h1>Gestión de Lugares</h1>

<hr/>

<!-- Buscar Lugar por Direccion -->
<section>
    <h2>Buscar Lugar por Dirección</h2>
    <form th:action="@{/lugares/buscar-por-direccion}" method="get">
        <label for="direccionBuscar">Dirección:</label>
        <input type="text" id="direccionBuscar" name="direccion" required />
        <button type="submit">Buscar</button>
    </form>
</section>

<!-- Agregar Lugar -->
<section>
    <h2>Agregar Nuevo Lugar</h2>
    <form th:action="@{/lugares/agregar}" th:object="${lugarDTO}" method="post">
        <label for="direccionAgregar">Dirección:</label>
        <input type="text" id="direccionAgregar" th:field="*{direccion}" required />
        <button type="submit">Agregar Lugar</button>
    </form>
</section>

<!-- Modificar Lugar -->
<section>
    <h2>Modificar Lugar Existente</h2>
    <form th:action="@{/lugares/modificar}" method="post">
        <label for="direccion">Dirección del Lugar a modificar:</label>
		<input type="text" id="direccion" name="direccionVieja" required />

        <label for="direccionModificar">Nueva Dirección:</label>
        <input type="text" id="direccionModificar" name="direccion" required />

        <button type="submit">Modificar Lugar</button>
    </form>
</section>

<!-- Eliminar Lugar por Dirección -->
<section>
    <h2>Eliminar Lugar por Dirección</h2>
    <form th:action="@{/lugares/eliminar}" method="post">
        <label for="direccionEliminar">Dirección del Lugar a eliminar:</label>
        <input type="text" id="direccionEliminar" name="direccion" required />
		
        <button type="submit">Eliminar</button>
    </form>
</section>

	<div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>
    </div>
</body>
</html>
