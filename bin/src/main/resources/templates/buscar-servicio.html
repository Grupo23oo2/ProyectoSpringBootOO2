<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestión de Servicios</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>
<body>

<h1>Gestión de Servicios</h1>

<hr/>

<!-- Mensajes -->
<p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<!-- Buscar Servicio -->
<section>
    <h2>Buscar Servicio por Descripción</h2>
    <form th:action="@{/servicios/buscar-por-descripcion}" method="get">
        <label for="descripcionBuscar">Descripción:</label>
        <input type="text" id="descripcionBuscar" name="descripcion" required />
        <button type="submit">Buscar</button>
    </form>
</section>

<!-- Agregar Servicio -->
<section>
    <h2>Agregar Nuevo Servicio</h2>
	<form th:action="@{/servicios/agregar}" method="post">
	    <label for="descripcionAgregar">Descripción:</label>
	    <input type="text" id="descripcionAgregar" name="descripcion" required />

	    <label for="duracionAgregar">Duración:</label>
	    <input type="number" id="duracionAgregar" name="duracion" required />

	    <button type="submit">Agregar</button>
	</form>
</section>

<section>
    <h2>Ver Todos los Servicios</h2>
    <form th:action="@{/servicios/todos}" method="get">
        <button type="submit">Mostrar Todos</button>
    </form>
</section>

<!-- Volver -->
<div style="text-align: center; margin-top: 20px;">
    <a href="/" class="btn">← Volver</a>
</div>

</body>
</html>
