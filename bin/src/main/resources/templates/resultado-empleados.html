<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Resultado Empleados</title>
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>
<body>

    <h1>Resultado de Búsqueda</h1>
    <hr/>

    <!-- Mensaje informativo -->
    <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
	<p class="error" th:if="${error}" th:text="${error}"></p>

    <!-- Empleado individual -->
    <section th:if="${empleado != null}">
        <h2>Empleado Encontrado</h2>
        <p><strong>ID:</strong> <span th:text="${empleado.idPersona}"></span></p>
        <p><strong>Nombre:</strong> <span th:text="${empleado.nombre}"></span></p>
        <p><strong>Apellido:</strong> <span th:text="${empleado.apellido}"></span></p>
        <p><strong>DNI:</strong> <span th:text="${empleado.dni}"></span></p>
        <p><strong>Fecha de inicio:</strong> <span th:text="${empleado.fechaInicio}"></span></p>
    </section>

    <!-- Lista de empleados -->
    <section th:if="${empleados != null}">
        <h2>Empleados Encontrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Fecha de Inicio</th>
					<th>Acciones</th>

                </tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${empleados}">
                    <td th:text="${emp.idPersona}"></td>
                    <td th:text="${emp.nombre}"></td>
                    <td th:text="${emp.apellido}"></td>
                    <td th:text="${emp.dni}"></td>
                    <td th:text="${emp.fechaInicio}"></td>

					<td>
						<div style="display: flex; align-items: center; gap: 10px;">
					        <a th:href="@{'/empleados/editar/' + ${emp.dni}}" title="Editar">
					            <img th:src="@{/icons/pencil.svg}" alt="Editar" width="20" height="20" />
					        </a>

					        <form th:action="@{/empleados/eliminar}" method="post">
								<input type="hidden" name="dni" th:value="${emp.dni}" />
							    <button type="submit" title="Eliminar" style="background: none; border: none; padding: 0; cursor: pointer;">
							        <img th:src="@{/icons/trash.svg}" alt="Eliminar" width="20" height="20" />
							    </button>
					        </form>
					    </div>
			        </td>

                </tr>
            </tbody>
        </table>
    </section>

	<section th:if="${empleadoEditar != null}">
	    <h2>Modificar Empleado</h2>
		<form th:action="@{/empleados/modificar}" method="post">
		    <input type="hidden" name="dniOriginal" th:value="${empleadoEditar.dni}" />

		    <label for="nombreMod">Nombre:</label>
		    <input type="text" id="nombreMod" name="nombre" th:value="${empleadoEditar.nombre}" />

		    <label for="apellidoMod">Apellido:</label>
		    <input type="text" id="apellidoMod" name="apellido" th:value="${empleadoEditar.apellido}" />

		    <label for="dniMod">DNI:</label>
		    <input type="text" id="dniMod" name="dni" th:value="${empleadoEditar.dni}" />

		    <label for="fechaInicioMod">Fecha de Inicio:</label>
		    <input type="date" id="fechaInicioMod" name="fechaInicio" th:value="${empleadoEditar.fechaInicio}" />

		    <button type="submit">Modificar</button>
		</form>
	</section>

	<div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>
    </div>

</body>
</html>
