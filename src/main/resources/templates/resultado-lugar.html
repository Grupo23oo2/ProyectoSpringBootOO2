<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Resultado de Operación</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>
<body>

    <h1>Resultado de la operación sobre Lugar</h1>
    <hr/>

	<!-- Mensaje de éxito -->
	<p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
	
    <!-- Mostrar un solo lugar -->
    <section th:if="${lugar != null}">
        <h2>Lugar Encontrado</h2>
        <p><strong>ID Lugar:</strong> <span th:text="${lugar.idLugar}"></span></p>
        <p><strong>Dirección:</strong> <span th:text="${lugar.direccion}"></span></p>
    </section>

	<div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>
    </div>
</body>
</html>
