<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>
<body>

<h1>Gestión de Usuarios</h1>

<hr/>

<!-- Modificar Usuario -->
<section>
    <h2>Modificar Usuario</h2>
    <form th:action="@{/usuarios/modificar}" method="post">
		<div>
        	<label for="emailMod">Email del Usuario a modificar:</label>
			<input type="email" id="emailMod" name="email" required />
		</div>
			
		<div>
        	<label for="nombreUsuario">Nuevo Nombre de Usuario:</label>
        	<input type="text" id="nombreUsuario" name="nombreUsuario" required />
		</div>
			
		<div>
        	<label for="email">Nuevo Email:</label>
        	<input type="email" id="email" name="email" required />
		</div>
			
		<div>
        	<label for="contraseniaUsuario">Nueva Contraseña:</label>
        	<input type="password" id="contraseniaUsuario" name="contraseniaUsuario" required />
		</div>
		
		<div>
        <label for="estadoMod">Estado (activo):</label>
        <input type="checkbox" id="estadoMod" name="estado" checked />
		</div>
		
		<div>
        	<button type="submit">Modificar Usuario</button>
		</div>
    </form>
</section>

<!-- Eliminar Usuario -->
<section>
    <h2>Eliminar Usuario</h2>
    <form th:action="@{/usuarios/eliminar}" method="post">
        <label for="emailEliminar">Email del Usuario:</label>
		<input type="email" id="emailEliminar" name="email" required />
        <button type="submit">Eliminar Usuario</button>
    </form>
</section>

<!-- Buscar Usuario por Email -->
<section>
    <h2>Buscar Usuario por Email</h2>
    <form th:action="@{/usuarios/buscar-por-email}" method="get">
        <label for="emailBuscar">Email:</label>
        <input type="email" id="emailBuscar" name="email" required />
        <button type="submit">Buscar</button>
    </form>
</section>

<div style="text-align: center; margin-top: 20px;">
    <a href="/" class="btn">← Volver</a>
</div>

</body>
</html>
