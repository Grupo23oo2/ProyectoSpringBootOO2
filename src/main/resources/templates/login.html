<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>
<body>
    <h1>Iniciar Sesión</h1>

    <section>
        <div th:if="${mensaje}" style="color: green; text-align: center; margin-bottom: 20px;">
            <p th:text="${mensaje}"></p>
        </div>

        <form th:action="@{/login}" method="post">
            <label for="username">Usuario:</label>
            <input id="username" type="text" name="username" required/>

            <label for="password">Contraseña:</label>
            <input id="password" type="password" name="password" required/>

			<div style="text-align: center; margin-top: 20px;">
			    <button type="submit">Entrar</button>
			</div>

            <div th:if="${mensajeError}">
                <p style="color:red;" th:text="${mensajeError}"></p>
            </div>
            <div th:if="${mensajeLogout}">
                <p style="color:green;" th:text="${mensajeLogout}"></p>
            </div>
        </form>
    </section>
	
	<div style="text-align: center; margin-top: 20px;">
	    <a href="/registro/formulario-empleado" class="btn">Registro Empleado</a>
		<a href="/registro/formulario-cliente" class="btn">Registro Cliente</a>
	</div>
</body>
</html>
