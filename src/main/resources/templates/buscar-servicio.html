<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Servicio</title>
</head>
<body>
    <h1>Buscar Servicio por Descripción</h1>
    <form th:action="@{/servicios/buscar-por-descripcion}" method="get">
        <label>Descripción:</label>
        <input type="text" name="descripcion" required />
        <button type="submit">Buscar</button>
    </form>

    <hr>

    <h2>Agregar Nuevo Servicio</h2>
    <form th:action="@{/servicios/agregar}" method="post" th:object="${servicioDTO}">
        <label>Descripción:</label>
        <input type="text" th:field="*{descripcion}" required />
        <br>
        <label>Duración:</label>
        <input type="number" th:field="*{duracion}" required />
        <br>
        <button type="submit">Agregar</button>
    </form>

    <hr>

    <h2>Modificar Servicio</h2>
    <form th:action="@{/servicios/modificar}" method="post" th:object="${servicioDTO}">
        <label>Descripción del servicio a modificar:</label>
        <input type="text" name="descripcion" required />
        <br>
        <label>Nueva Descripción:</label>
        <input type="text" th:field="*{descripcion}" required />
        <br>
        <label>Nueva Duración:</label>
        <input type="number" th:field="*{duracion}" required />
        <br>
        <button type="submit">Modificar</button>
    </form>

    <hr>

    <h2>Eliminar Servicio</h2>
    <form th:action="@{/servicios/eliminar}" method="post">
        <label>Descripción:</label>
        <input type="text" name="descripcion" required />
        <button type="submit">Eliminar</button>
    </form>

    <hr>

    <a th:href="@{/servicios/todos}">Ver Todos los Servicios</a>
</body>
</html>
