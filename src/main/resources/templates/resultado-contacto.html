<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contacto del Cliente</title>
    <link rel="stylesheet" th:href="@{/css/general.css}">
</head>
<body>

    <h1>Resultado de Búsqueda</h1>
    <hr/>
	
	<!-- Mensaje de éxito -->
	<p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
	
	<!-- Sección de información del contacto -->
    <section th:if="${contacto != null}">
        <p><strong>Teléfono:</strong> <span th:text="${contacto.telefono}"></span></p>
        <p><strong>Email:</strong> <span th:text="${contacto.email}"></span></p>
        <p><strong>Dirección:</strong> <span th:text="${contacto.direccion}"></span></p>
    </section>

	<div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>
    </div>

</body>
</html>
