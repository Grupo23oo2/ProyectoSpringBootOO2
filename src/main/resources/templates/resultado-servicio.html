<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resultado Servicio</title>
</head>
<body>
    <h1>Resultado del Servicio</h1>

    <div th:if="${servicio != null}">
        <p><strong>Descripción:</strong> <span th:text="${servicio.descripcion}"></span></p>
        <p><strong>Duración:</strong> <span th:text="${servicio.duracion}"></span> minutos</p>
        <p><strong>Activo:</strong> <span th:text="${servicio.activo} ? 'Sí' : 'No'"></span></p>
    </div>

    <div th:if="${mensaje != null}">
        <p th:text="${mensaje}"></p>
    </div>

    <a th:href="@{/servicios/formulario}">Volver al formulario</a>
</body>
</html>
