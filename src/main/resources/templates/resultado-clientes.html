<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Resultado Clientes</title>
    <link rel="stylesheet" th:href="@{/css/general.css}" />
</head>
<body>

    <h1>Resultado de Búsqueda</h1>
    <hr/>

    <!-- Mensaje informativo -->
    <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>

    <!-- Cliente individual -->
    <section th:if="${cliente != null}">
        <h2>Cliente Encontrado</h2>
        <p><strong>ID:</strong> <span th:text="${cliente.idPersona}"></span></p>
        <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
        <p><strong>Apellido:</strong> <span th:text="${cliente.apellido}"></span></p>
        <p><strong>DNI:</strong> <span th:text="${cliente.dni}"></span></p>
        <p><strong>CUIT:</strong> <span th:text="${cliente.cuit}"></span></p>
        <p><strong>ID Usuario:</strong> 
            <span th:if="${cliente.idUsuario != null}" th:text="${cliente.idUsuario}"></span>
            <span th:unless="${cliente.idUsuario != null}">Sin usuario</span>
        </p>
    </section>

    <!-- Lista de clientes -->
    <section th:if="${clientes != null}">
        <h2>Clientes Encontrados</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>CUIT</th>
                    <th>Usuario</th>

                    <th>Acciones</th>

                </tr>
            </thead>
            <tbody>
                <tr th:each="cli : ${clientes}">
                    <td th:text="${cli.idPersona}"></td>
                    <td th:text="${cli.nombre}"></td>
                    <td th:text="${cli.apellido}"></td>
                    <td th:text="${cli.dni}"></td>
                    <td th:text="${cli.cuit}"></td>
                    <td>
                        <span th:if="${cli.idUsuario != null}" th:text="${cli.idUsuario}"></span>
                        <span th:unless="${cli.idUsuario != null}">Sin usuario</span>
                    </td>

					<td>
						<div style="display: flex; align-items: center; gap: 10px;">
					       	<a th:href="@{'/clientes/editar/' + ${cli.dni}}" title="Editar">
					            <img th:src="@{/icons/pencil.svg}" alt="Editar" width="20" height="20" />
					        </a>
	
					        <form th:action="@{/clientes/eliminar}" method="post">
								<input type="hidden" name="dni" th:value="${cli.dni}" />
							    <button type="submit" title="Eliminar" style="background: none; border: none; padding: 0; cursor: pointer;">
							        <img th:src="@{/icons/trash.svg}" alt="Eliminar" width="20" height="20" />
							    </button>
					        </form>
					    </div>
			        </td>

                </tr>
            </tbody>
        </table>
    </section>
	
	<section th:if="${clienteEditar != null}">
	    <form th:action="@{/clientes/modificar}" method="post">
			<h2>Modificar Cliente</h2>
	        <input type="hidden" name="dniOriginal" th:value="${clienteEditar.dni}" />

	        <label for="nombreMod">Nombre:</label>
	        <input type="text" id="nombreMod" name="nombre" th:value="${clienteEditar.nombre}" />

	        <label for="apellidoMod">Apellido:</label>
	        <input type="text" id="apellidoMod" name="apellido" th:value="${clienteEditar.apellido}" />

	        <label for="dniMod">DNI:</label>
	        <input type="text" id="dniMod" name="dni" th:value="${clienteEditar.dni}" />

	        <label for="cuitMod">CUIT:</label>
	        <input type="text" id="cuitMod" name="cuit" th:value="${clienteEditar.cuit}" />
			
			<h2>Modificar Contacto</h2>
			<label for="emailMod">Email:</label>
			<input type="text" id="emailMod" name="emailContacto" th:value="${contactoEditar.email}" />

			<label for="telefonoMod">Teléfono:</label>
			<input type="text" id="telefonoMod" name="telefonoContacto" th:value="${contactoEditar.telefono}" />

			<label for="direccionMod">Dirección:</label>
			<input type="text" id="direccionMod" name="direccionContacto" th:value="${contactoEditar.direccion}" />

	        <button type="submit">Modificar</button>
	    </form>
	</section>


	<div style="text-align: center; margin-top: 20px;">
        <a href="/" class="btn">← Volver</a>

    </div>

</body>
</html>
